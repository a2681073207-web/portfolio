name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check site chunks
        id: chunks
        run: |
          count=$(find . -maxdepth 1 -name 'portfolio-site-*.zip' | wc -l)
          if [ "$count" -lt 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for all 3 site chunks."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.chunks.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Unpack site
        if: steps.chunks.outputs.ready == 'true'
        run: |
          rm -rf site
          mkdir -p site
          for part in portfolio-site-*.zip; do unzip -qo "$part" -d site; done
      - name: Upload static site
        if: steps.chunks.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        if: steps.chunks.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
